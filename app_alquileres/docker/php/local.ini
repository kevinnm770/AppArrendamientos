upload_max_filesize=64M
post_max_size=64M
memory_limit=512M
max_execution_time=120
max_input_vars=5000

; Cachea el bytecode de PHP en memoria para no recompilar vendor/ en cada
; request; validate_timestamps sigue en 1 para que los cambios de código se
; reflejen sin reiniciar el contenedor.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
